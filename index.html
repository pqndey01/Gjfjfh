<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Puppet Test</title>
<style>
  :root { --bg:#14161a; --card:#1f2229; --text:#eceff4; --muted:#9aa3b2; --accent:#ff6fa5; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size:1.3rem; margin:0 0 6px; }
  .note { color:var(--muted); font-size:.85rem; margin:0 0 14px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:center; }
  input[type=file] { color:var(--muted); max-width:100%; }
  button { background:var(--accent); color:#111; border:0; border-radius:8px;
           padding:9px 16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  #status { color:var(--muted); font-size:.9rem; margin-bottom:12px; min-height:1.2em; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:700px) { .grid { grid-template-columns:1fr; } }
  .box { background:var(--card); border-radius:12px; padding:10px; }
  .box h3 { margin:0 0 8px; font-size:.9rem; color:var(--muted); font-weight:500; }
  video, canvas { width:100%; height:auto; border-radius:8px; background:#000; display:block; }
  video { transform:scaleX(-1); aspect-ratio:4/3; object-fit:cover; }
  canvas { aspect-ratio:640/720; }
</style>
</head>
<body>
<h1>Image Puppet (test)</h1>
<p class="note">Sirf apni, AI-generated ya permission wali image use karo. Sab kuch browser me local chalta hai, koi photo ya video upload/save nahi hota.</p>

<div class="controls">
  <input type="file" id="file" accept="image/*">
  <button id="start" disabled>Start</button>
  <button id="calib" disabled>Calibrate</button>
  <button id="stop" disabled>Stop</button>
</div>
<div id="status">Model load ho raha hai...</div>

<div class="grid">
  <div class="box"><h3>Webcam</h3><video id="cam" playsinline muted></video></div>
  <div class="box"><h3>Output</h3><canvas id="out" width="640" height="720"></canvas></div>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";
import { Delaunay } from "https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/+esm";

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const MAX_TEX = 1024;

const $ = id => document.getElementById(id);
const cam = $("cam"), out = $("out"), ctx = out.getContext("2d");
const setStatus = t => { $("status").textContent = t; };

let imgLm, vidLm;
let tex = null, imgPts = null, tris = null, fit = null, R = null;
let stream = null, running = false, neutral = null, calibReq = false, lastT = -1;

async function init() {
  try {
    const fs = await FilesetResolver.forVisionTasks(WASM);
    const make = async (mode, delegate) => FaceLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: MODEL, delegate },
      runningMode: mode, numFaces: 1
    });
    imgLm = await make("IMAGE", "CPU");
    try { vidLm = await make("VIDEO", "GPU"); }
    catch { vidLm = await make("VIDEO", "CPU"); }
    setStatus("Ready. Pehle image upload karo.");
  } catch (e) {
    setStatus("Model load nahi hua: " + e.message + " (internet check karo)");
  }
}

// ---------- image upload ----------
$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f || !imgLm) return;
  setStatus("Image check ho rahi hai...");
  const im = new Image();
  im.src = URL.createObjectURL(f);
  try { await im.decode(); } catch { setStatus("Image open nahi hui."); return; }

  const sc = Math.min(1, MAX_TEX / Math.max(im.naturalWidth, im.naturalHeight));
  const t = document.createElement("canvas");
  t.width = Math.round(im.naturalWidth * sc);
  t.height = Math.round(im.naturalHeight * sc);
  t.getContext("2d").drawImage(im, 0, 0, t.width, t.height);

  const res = imgLm.detect(t);
  if (!res.faceLandmarks.length) {
    setStatus("Image me saaf face nahi mila. Front-facing face wali image lo.");
    return;
  }
  tex = t;
  imgPts = res.faceLandmarks[0].map(p => [p.x * t.width, p.y * t.height]);

  const s = Math.min(out.width / t.width, out.height / t.height);
  fit = { s, ox: (out.width - t.width * s) / 2, oy: (out.height - t.height * s) / 2 };
  R = imgPts.map(p => [p[0] * fit.s + fit.ox, p[1] * fit.s + fit.oy]);

  // triangulate face mesh
  const d = Delaunay.from(imgPts);
  const faceW = Math.hypot(imgPts[234][0] - imgPts[454][0], imgPts[234][1] - imgPts[454][1]);
  tris = [];
  for (let i = 0; i < d.triangles.length; i += 3) {
    const a = d.triangles[i], b = d.triangles[i + 1], c = d.triangles[i + 2];
    const e1 = dist(imgPts[a], imgPts[b]), e2 = dist(imgPts[b], imgPts[c]), e3 = dist(imgPts[c], imgPts[a]);
    if (Math.max(e1, e2, e3) < faceW * 0.45) tris.push([a, b, c]);
  }

  drawStatic();
  $("start").disabled = false;
  setStatus("Image ready. Start dabao.");
};

function drawStatic() {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(tex, fit.ox, fit.oy, tex.width * fit.s, tex.height * fit.s);
}

// ---------- webcam ----------
$("start").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: "user" }, audio: false
    });
  } catch (e) { setStatus("Camera permission nahi mili."); return; }
  cam.srcObject = stream;
  await cam.play();
  running = true; neutral = null; lastT = -1;
  $("start").disabled = true; $("calib").disabled = false; $("stop").disabled = false;
  setStatus("Seedha camera me dekho, neutral face. Phir hilo / bolo.");
  loop();
};

$("calib").onclick = () => { calibReq = true; setStatus("Calibrated: ab neutral face yahi maana jayega."); };

$("stop").onclick = () => {
  running = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  cam.srcObject = null;
  $("start").disabled = false; $("calib").disabled = true; $("stop").disabled = true;
  if (tex) drawStatic();
  setStatus("Stopped.");
};

function loop() {
  if (!running) return;
  if (cam.readyState >= 2 && cam.currentTime !== lastT) {
    lastT = cam.currentTime;
    const r = vidLm.detectForVideo(cam, performance.now());
    if (r.faceLandmarks.length) {
      const vw = cam.videoWidth, vh = cam.videoHeight;
      const W = r.faceLandmarks[0].map(p => [(1 - p.x) * vw, p.y * vh]); // mirrored
      if (!neutral || calibReq) { neutral = W; calibReq = false; }
      render(W);
    }
  }
  requestAnimationFrame(loop);
}

// ---------- math ----------
function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// eyes se similarity transform (scale, rotation, midpoint) A -> B
function sim(A, B) {
  const a0 = A[33], a1 = A[263], b0 = B[33], b1 = B[263];
  const va = [a1[0] - a0[0], a1[1] - a0[1]], vb = [b1[0] - b0[0], b1[1] - b0[1]];
  return {
    s: Math.hypot(vb[0], vb[1]) / Math.hypot(va[0], va[1]),
    th: Math.atan2(vb[1], vb[0]) - Math.atan2(va[1], va[0]),
    ma: [(a0[0] + a1[0]) / 2, (a0[1] + a1[1]) / 2],
    mb: [(b0[0] + b1[0]) / 2, (b0[1] + b1[1]) / 2]
  };
}

function drawTri(src, dst) {
  const [x0, y0] = src[0], [x1, y1] = src[1], [x2, y2] = src[2];
  const [u0, v0] = dst[0], [u1, v1] = dst[1], [u2, v2] = dst[2];
  const den = x0 * (y1 - y2) + x1 * (y2 - y0) + x2 * (y0 - y1);
  if (Math.abs(den) < 1e-6) return;
  const a = (u0 * (y1 - y2) + u1 * (y2 - y0) + u2 * (y0 - y1)) / den;
  const b = (v0 * (y1 - y2) + v1 * (y2 - y0) + v2 * (y0 - y1)) / den;
  const c = (u0 * (x2 - x1) + u1 * (x0 - x2) + u2 * (x1 - x0)) / den;
  const d = (v0 * (x2 - x1) + v1 * (x0 - x2) + v2 * (x1 - x0)) / den;
  const e = (u0 * (x1 * y2 - x2 * y1) + u1 * (x2 * y0 - x0 * y2) + u2 * (x0 * y1 - x1 * y0)) / den;
  const f = (v0 * (x1 * y2 - x2 * y1) + v1 * (x2 * y0 - x0 * y2) + v2 * (x0 * y1 - x1 * y0)) / den;

  // clip triangle (thoda bahar tak taaki seam na dikhe)
  const cx = (u0 + u1 + u2) / 3, cy = (v0 + v1 + v2) / 3;
  const grow = (u, v) => { const dx = u - cx, dy = v - cy, l = Math.hypot(dx, dy) || 1; return [u + dx / l * 0.8, v + dy / l * 0.8]; };
  const p0 = grow(u0, v0), p1 = grow(u1, v1), p2 = grow(u2, v2);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]);
  ctx.closePath(); ctx.clip();
  ctx.transform(a, b, c, d, e, f);
  ctx.drawImage(tex, 0, 0);
  ctx.restore();
}

function render(W) {
  const S = sim(neutral, W);
  const nFaceW = dist(neutral[234], neutral[454]);
  const r = (dist(imgPts[234], imgPts[454]) * fit.s) / nFaceW;  // webcam px -> canvas px

  // expression residual (pose hata kar)
  const cos = Math.cos(-S.th), sin = Math.sin(-S.th);
  const D = new Array(R.length);
  for (let i = 0; i < R.length; i++) {
    let px = W[i][0] - S.mb[0], py = W[i][1] - S.mb[1];
    let qx = (px * cos - py * sin) / S.s + S.ma[0];
    let qy = (px * sin + py * cos) / S.s + S.ma[1];
    D[i] = [R[i][0] + (qx - neutral[i][0]) * r, R[i][1] + (qy - neutral[i][1]) * r];
  }

  // pose: poori image (sir + body) rotate/scale/move
  const s = clamp(S.s, 0.7, 1.5);
  const tx = clamp((S.mb[0] - S.ma[0]) * r * 0.8, -150, 150);
  const ty = clamp((S.mb[1] - S.ma[1]) * r * 0.8, -150, 150);
  const c = R[1];

  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, out.width, out.height);
  ctx.save();
  ctx.translate(c[0] + tx, c[1] + ty);
  ctx.rotate(S.th);
  ctx.scale(s, s);
  ctx.translate(-c[0], -c[1]);

  ctx.drawImage(tex, fit.ox, fit.oy, tex.width * fit.s, tex.height * fit.s);
  for (const [a, b, cc] of tris) drawTri([imgPts[a], imgPts[b], imgPts[cc]], [D[a], D[b], D[cc]]);
  ctx.restore();
}

init();
</script>
</body>
  </html>
