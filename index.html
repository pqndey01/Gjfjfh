<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Face Swap Demo</title>
<style>
  body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif}
  .wrap{max-width:520px;margin:auto;padding:10px}
  .box{position:relative;margin-bottom:10px;border-radius:12px;overflow:hidden;background:#000;min-height:120px}
  video,canvas{width:100%;display:block;transform:scaleX(-1)}
  .tag{position:absolute;top:6px;left:6px;background:#000a;padding:2px 8px;border-radius:6px;font-size:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  button,label.btn{background:#6c4cff;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
  button:disabled{opacity:.4}
  #status{font-size:13px;opacity:.8;margin-bottom:8px}
  .consent{font-size:13px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
  #thumb{height:48px;border-radius:8px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h3>Live Face Swap (Demo)</h3>

  <label class="consent">
    <input type="checkbox" id="consent">
    <span>Main sirf apna chehra ya us insaan ki photo use karunga jisne permission di hai (ya AI-generated chehra). Output "AI edited" hai.</span>
  </label>

  <div class="row">
    <button id="startBtn" disabled>Camera Start</button>
    <button id="flipBtn" disabled>Camera Flip</button>
    <label class="btn">Image Upload
      <input type="file" id="file" accept="image/*" hidden>
    </label>
    <img id="thumb" alt="">
  </div>
  <div id="status">Model load ho raha hai...</div>

  <!-- Screen A -->
  <div class="box">
    <span class="tag">A: Live (Main)</span>
    <video id="video" autoplay playsinline muted></video>
  </div>

  <!-- Screen B -->
  <div class="box">
    <span class="tag">B: Swap (AI edited)</span>
    <canvas id="out"></canvas>
  </div>
</div>

<script type="module">
import {FaceLandmarker, FilesetResolver} from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("video"), cv = $("out"), ctx = cv.getContext("2d");
const statusEl = $("status"), consent = $("consent");
const startBtn = $("startBtn"), flipBtn = $("flipBtn");

const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
let vidLm, imgLm, tris = [], srcImg = null, srcPts = null;
let facing = "user", stream = null, lastTime = -1, ready = false;

// ---------- Model load ----------
async function init(){
  const fs = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const mk = mode => FaceLandmarker.createFromOptions(fs, {
    baseOptions:{modelAssetPath:MODEL, delegate:"GPU"},
    runningMode:mode, numFaces:1
  });
  vidLm = await mk("VIDEO");
  imgLm = await mk("IMAGE");

  // tessellation edges -> triangles
  const adj = new Map();
  for (const {start:a,end:b} of FaceLandmarker.FACE_LANDMARKS_TESSELATION){
    if(!adj.has(a)) adj.set(a,new Set());
    if(!adj.has(b)) adj.set(b,new Set());
    adj.get(a).add(b); adj.get(b).add(a);
  }
  const seen = new Set();
  for (const [a,nb] of adj){
    for (const b of nb){
      if(b<=a) continue;
      for (const c of adj.get(b)){
        if(c<=b || !nb.has(c)) continue;
        const k = a+"_"+b+"_"+c;
        if(!seen.has(k)){ seen.add(k); tris.push([a,b,c]); }
      }
    }
  }
  ready = true;
  statusEl.textContent = "Ready. Pehle checkbox tick karo, phir camera start karo aur image upload karo.";
  startBtn.disabled = !consent.checked;
}
consent.onchange = () => { startBtn.disabled = !(consent.checked && ready); };

// ---------- Camera ----------
async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing, width:{ideal:640}, height:{ideal:480}}, audio:false
  });
  video.srcObject = stream;
  await video.play();
  cv.width = video.videoWidth; cv.height = video.videoHeight;
  flipBtn.disabled = false;
  statusEl.textContent = srcImg ? "Running." : "Camera on. Ab image upload karo.";
}
startBtn.onclick = () => startCam().catch(e => statusEl.textContent = "Camera error: " + e.message);
flipBtn.onclick = () => { facing = facing==="user" ? "environment" : "user"; startCam(); };

// ---------- Image upload ----------
$("file").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  if(!consent.checked){ statusEl.textContent = "Pehle checkbox tick karo."; return; }
  const img = new Image();
  img.onload = () => {
    const r = imgLm.detect(img);
    if(!r.faceLandmarks.length){
      statusEl.textContent = "Is image me chehra nahi mila. Seedha front-face wali image use karo.";
      srcImg = null; srcPts = null; return;
    }
    srcImg = img;
    srcPts = r.faceLandmarks[0].map(p => ({x:p.x*img.naturalWidth, y:p.y*img.naturalHeight}));
    $("thumb").src = img.src; $("thumb").style.display = "block";
    statusEl.textContent = "Image ready. Swap chal raha hai.";
  };
  img.src = URL.createObjectURL(f);
};

// ---------- Triangle warp ----------
function drawTri(s0,s1,s2,d0,d1,d2){
  const den = s0.x*(s1.y-s2.y)+s1.x*(s2.y-s0.y)+s2.x*(s0.y-s1.y);
  if(Math.abs(den) < 1e-6) return;
  const a=(d0.x*(s1.y-s2.y)+d1.x*(s2.y-s0.y)+d2.x*(s0.y-s1.y))/den;
  const b=(d0.y*(s1.y-s2.y)+d1.y*(s2.y-s0.y)+d2.y*(s0.y-s1.y))/den;
  const c=(d0.x*(s2.x-s1.x)+d1.x*(s0.x-s2.x)+d2.x*(s1.x-s0.x))/den;
  const d=(d0.y*(s2.x-s1.x)+d1.y*(s0.x-s2.x)+d2.y*(s1.x-s0.x))/den;
  const e=(d0.x*(s1.x*s2.y-s2.x*s1.y)+d1.x*(s2.x*s0.y-s0.x*s2.y)+d2.x*(s0.x*s1.y-s1.x*s0.y))/den;
  const f=(d0.y*(s1.x*s2.y-s2.x*s1.y)+d1.y*(s2.x*s0.y-s0.x*s2.y)+d2.y*(s0.x*s1.y-s1.x*s0.y))/den;

  // thoda expand karo taaki triangles ke beech seam na dikhe
  const cx=(d0.x+d1.x+d2.x)/3, cy=(d0.y+d1.y+d2.y)/3;
  const grow = p => { const dx=p.x-cx, dy=p.y-cy, l=Math.hypot(dx,dy)||1; return {x:p.x+dx/l*0.8, y:p.y+dy/l*0.8}; };
  const g0=grow(d0), g1=grow(d1), g2=grow(d2);

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(g0.x,g0.y); ctx.lineTo(g1.x,g1.y); ctx.lineTo(g2.x,g2.y); ctx.closePath();
  ctx.clip();
  ctx.setTransform(a,b,c,d,e,f);
  ctx.drawImage(srcImg,0,0);
  ctx.restore();
}

// ---------- Main loop ----------
function loop(){
  if(video.readyState >= 2 && video.currentTime !== lastTime){
    lastTime = video.currentTime;
    if(cv.width !== video.videoWidth){ cv.width = video.videoWidth; cv.height = video.videoHeight; }
    ctx.drawImage(video,0,0,cv.width,cv.height);

    if(srcImg && srcPts){
      const r = vidLm.detectForVideo(video, performance.now());
      const lm = r.faceLandmarks[0];
      if(lm){
        const dst = lm.map(p => ({x:p.x*cv.width, y:p.y*cv.height}));
        for(const [a,b,c] of tris) drawTri(srcPts[a],srcPts[b],srcPts[c],dst[a],dst[b],dst[c]);
      }
    }
  }
  requestAnimationFrame(loop);
}

init().then(loop).catch(e => statusEl.textContent = "Load error: " + e.message);
</script>
</body>
</html>
